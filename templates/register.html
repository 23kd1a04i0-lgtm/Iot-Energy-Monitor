<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <h1>⚡ IoT Smart Energy Monitoring</h1>

        <h2>Create Account</h2>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Enter Username"
                required>

            <br><br>

            <input
                type="email"
                name="email"
                placeholder="Enter Email"
                required>

            <br><br>

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required>

            <br><br>

            <button type="submit">
                Register
            </button>

        </form>

        <br>

        <a href="/login">
            Already have an account? Login
        </a>

        <br><br>

        <a href="/">
            ← Back to Home
        </a>

    </div>

</body>

</html>
