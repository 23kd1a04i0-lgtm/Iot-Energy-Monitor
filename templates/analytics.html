<!DOCTYPE html>
<html>
<head>

<title>Analytics</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h1 class="text-center">📊 Energy Analytics</h1>

<div class="row mt-4">

<div class="col-md-4">

<div class="card text-center">

<div class="card-body">

<h4>Average Voltage</h4>

<h2>{{ voltage }} V</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card text-center">

<div class="card-body">

<h4>Average Current</h4>

<h2>{{ current }} A</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card text-center">

<div class="card-body">

<h4>Average Power</h4>

<h2>{{ power }} W</h2>

</div>

</div>

</div>

<div class="col-md-6 mt-4">

<div class="card text-center">

<div class="card-body">

<h4>Average Energy</h4>

<h2>{{ energy }} kWh</h2>

</div>

</div>

</div>

<div class="col-md-6 mt-4">

<div class="card text-center">

<div class="card-body">

<h4>Average Cost</h4>

<h2>₹ {{ cost }}</h2>

</div>

</div>

</div>

</div>

<br>

<a href="/dashboard" class="btn btn-primary">
Back to Dashboard
</a>

</div>

</body>
</html>
