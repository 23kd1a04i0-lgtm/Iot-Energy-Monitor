<!DOCTYPE html>
<html>

<head>

    <title>User Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-body text-center">

<img src="https://via.placeholder.com/150"
     class="rounded-circle mb-3"
     width="150">

<h2>{{ username }}</h2>

<p class="text-muted">

IoT Smart Energy Monitoring User

</p>

<hr>

<div class="row">

<div class="col-md-4">

<h5>Total Energy</h5>

<h3>{{ energy }} kWh</h3>

</div>

<div class="col-md-4">

<h5>Estimated Cost</h5>

<h3>₹ {{ cost }}</h3>

</div>

<div class="col-md-4">

<h5>Devices</h5>

<h3>4</h3>

</div>

</div>

<br>

<a href="/dashboard" class="btn btn-primary">

⬅ Back to Dashboard

</a>

</div>

</div>

</div>

</body>

</html>
